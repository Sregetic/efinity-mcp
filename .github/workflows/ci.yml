name: Ti60 deployment tool checks (no Efinity or hardware)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m compileall -q fpga/vision_base/scripts scripts/runner
      - run: python -m pytest -q tests/test_runner_entrypoints.py
      - run: pwsh -NoProfile -File tests/Test-RunnerGates.ps1
